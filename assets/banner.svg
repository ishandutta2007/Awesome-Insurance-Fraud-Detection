<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 48px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
      letter-spacing: 1px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.3;
      stroke-width: 1;
    }
    .node {
      animation: pulse 3s infinite alternate;
    }
    @keyframes pulse {
      0% { r: 5px; opacity: 0.4; }
      100% { r: 9px; opacity: 0.9; }
    }
    .scan-line {
      animation: scan 4s linear infinite;
    }
    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(340px); opacity: 0; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic / Animated Background Graphics (Pills, Node Network, Graph Lines) -->
  <g opacity="0.25">
    <!-- Grid -->
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line"/>
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line"/>
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line"/>
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line"/>
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line"/>
    
    <line x1="200" y1="0" x2="200" y2="340" class="grid-line"/>
    <line x1="400" y1="0" x2="400" y2="340" class="grid-line"/>
    <line x1="600" y1="0" x2="600" y2="340" class="grid-line"/>
    <line x1="800" y1="0" x2="800" y2="340" class="grid-line"/>
    <line x1="1000" y1="0" x2="1000" y2="340" class="grid-line"/>

    <!-- Network Graph Connections in Background -->
    <path d="M 100 280 L 250 180 L 400 230 L 550 120 L 700 200 L 900 90 L 1100 220" stroke="#818cf8" stroke-width="2" fill="none" stroke-dasharray="6,6"/>
    
    <!-- Animated Network Nodes -->
    <circle cx="100" cy="280" r="6" fill="#38bdf8" class="node"/>
    <circle cx="250" cy="180" r="7" fill="#818cf8" class="node" style="animation-delay: 0.5s;"/>
    <circle cx="400" cy="230" r="5" fill="#c084fc" class="node" style="animation-delay: 1s;"/>
    <circle cx="550" cy="120" r="8" fill="#38bdf8" class="node" style="animation-delay: 1.5s;"/>
    <circle cx="700" cy="200" r="6" fill="#818cf8" class="node" style="animation-delay: 2s;"/>
    <circle cx="900" cy="90" r="7" fill="#c084fc" class="node" style="animation-delay: 2.5s;"/>
    <circle cx="1100" cy="220" r="6" fill="#38bdf8" class="node" style="animation-delay: 0.8s;"/>

    <!-- Dynamic Wave / Polygon Pill Graphic in Background -->
    <rect x="920" y="160" width="180" height="40" rx="20" fill="url(#shieldGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="1010" y="185" text-anchor="middle" fill="#a5b4fc" font-family="sans-serif" font-size="12" font-weight="bold">AI DETECTED: 99.4%</text>

    <rect x="100" y="70" width="160" height="36" rx="18" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="180" y="93" text-anchor="middle" fill="#7dd3fc" font-family="sans-serif" font-size="12" font-weight="bold">NETWORK GRAPH</text>
  </g>

  <!-- Scanning Beam Effect (Kept soft behind text) -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="3" class="scan-line" opacity="0.4"/>

  <!-- Foreground Shield Icon -->
  <g transform="translate(80, 115)" filter="url(#glow)">
    <path d="M 40 0 L 75 18 C 75 55 40 80 40 80 C 40 80 5 55 5 18 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="3"/>
    <path d="M 28 38 L 36 48 L 54 28" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Text Content (Strictly in foreground, crystal clear) -->
  <g transform="translate(180, 0)">
    <!-- Pill Tag -->
    <rect x="0" y="65" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="14" y="84" class="badge-text">🛡️ NEXT-GEN INSURTECH &amp; AI FRAUD</text>

    <!-- Main Title -->
    <text x="0" y="145" class="title">Awesome Insurance Fraud Detection</text>

    <!-- Subtitle -->
    <text x="0" y="190" class="subtitle">Curated SaaS Platforms, AI Models, Graph Analytics &amp; Open-Source Tools</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 225)">
      <rect x="0" y="0" width="150" height="32" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="75" y="21" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔍 Claims Intelligence</text>

      <rect x="162" y="0" width="165" height="32" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="244" y="21" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🕸️ Network Link Analysis</text>

      <rect x="339" y="0" width="155" height="32" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="416" y="21" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Anomaly Scoring</text>

      <rect x="506" y="0" width="145" height="32" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="578" y="21" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚨 SIU Workflows</text>
    </g>
  </g>
</svg>
